<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Recommendation Error - Chaos+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon/chaos+.png">
    <link rel="stylesheet" href="/css/disney.css">
    <style>
        html,
        body {
            background-color: #040714;
            color: #f9f9f9;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(ellipse at center top, rgba(11, 67, 150, 0.3) 0%, transparent 60%), #040714;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }

        .error-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            color: #f9f9f9;
        }

        .error-message {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            color: #cacaca;
            max-width: 500px;
        }

        .btn-home {
            background-color: #f9f9f9;
            color: #040714;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-home:hover {
            background-color: #cacaca;
            transform: scale(1.02);
            color: #040714;
        }

        .error-code {
            font-size: 0.85rem;
            color: #666;
            margin-top: 2rem;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-icon"><i class="fas fa-magic"></i></div>
        <h1 class="error-title">Recommendation Error</h1>
        <p class="error-message">Impossible de charger les recommandations pour le moment.<br>Veuillez réessayer plus
            tard.</p>
        <a href="/" class="btn-home"><i class="fas fa-home"></i> Retour à l'accueil</a>
        <p class="error-code">RECOMMENDATION_ERROR · Chaos+</p>
    </div>
</body>

</html>
