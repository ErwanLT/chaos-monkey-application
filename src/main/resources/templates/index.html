<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Chaos Monkey Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: #fff;
        }
        .navbar-brand img {
            height: 30px;
        }
        .genre-row {
            margin-bottom: 40px;
        }
        .genre-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .video-row {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .video-row::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari and Opera */
        }
        .video-card {
            flex: 0 0 auto;
            width: 280px;
            margin-right: 15px;
            background-color: #1d1d1d;
            border: 1px solid #303030;
            transition: transform .2s;
        }
        .video-card:hover {
            transform: scale(1.05);
        }
        .card-img-top {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .card-body {
            padding: 1rem;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                CHAOSFLIX
            </a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div th:each="genreEntry : ${genres}" class="genre-row">
            <h2 class="genre-title" th:text="${genreEntry.key}"></h2>
            <div class="video-row">
                <div th:each="video : ${genreEntry.value}" class="video-card card">
                    <img th:src="${video.thumbnailUrl}" class="card-img-top" alt="Video thumbnail">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${video.title}"></h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
