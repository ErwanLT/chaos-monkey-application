# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# OpenAPI Configuration
application.title=Chaos Monkey Application
application.description=APIs for Chaos Monkey Application
application.version=1.0.0
application.blog.url=https://eletutour.fr
application.license.name=Apache 2.0
application.license.url=https://www.apache.org/licenses/LICENSE-2.0
application.terms.url=https://eletutour.fr/terms
application.server.url=http://localhost:8080
application.server.description=Local Server

# Resilience4j Configurations
resilience4j.circuitbreaker.instances.recommendationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.recommendationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.recommendationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.recommendationService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.recommendationService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.recommendationService.maxAttempts=3
resilience4j.retry.instances.recommendationService.waitDuration=500ms

resilience4j.circuitbreaker.instances.streamingService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.streamingService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.streamingService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.streamingService.waitDurationInOpenState=5s

resilience4j.retry.instances.streamingService.maxAttempts=3
resilience4j.retry.instances.streamingService.waitDuration=1s