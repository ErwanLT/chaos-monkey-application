# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# Resilience4j Configurations
# Circuit Breaker for Recommendation Service
resilience4j.circuitbreaker.instances.recommendationServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.recommendationServiceCB.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.recommendationServiceCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.recommendationServiceCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.recommendationServiceCB.slidingWindowSize=10

# Circuit Breaker for Catalog Service
resilience4j.circuitbreaker.instances.catalogServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalogServiceCB.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.catalogServiceCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.catalogServiceCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.catalogServiceCB.slidingWindowSize=10

# Retry for Streaming Service
resilience4j.retry.instances.streamingServiceRetry.maxAttempts=3
resilience4j.retry.instances.streamingServiceRetry.waitDuration=1000
resilience4j.retry.instances.streamingServiceRetry.retryExceptions=java.util.concurrent.TimeoutException,java.io.IOException

# Retry for Catalog Service (incrementViewCount)
resilience4j.retry.instances.catalogServiceRetry.maxAttempts=3
resilience4j.retry.instances.catalogServiceRetry.waitDuration=1000
resilience4j.retry.instances.catalogServiceRetry.retryExceptions=java.util.concurrent.TimeoutException,java.io.IOException,org.springframework.dao.DataAccessException

# Retry for User Service (canAccessPremiumContent)
resilience4j.retry.instances.userServiceRetry.maxAttempts=3
resilience4j.retry.instances.userServiceRetry.waitDuration=1000
resilience4j.retry.instances.userServiceRetry.retryExceptions=java.util.concurrent.TimeoutException,java.io.IOException,org.springframework.dao.DataAccessException
